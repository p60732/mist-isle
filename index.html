<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>燈芯島 3D 地圖試玩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700&display=swap">
<style>
/* Layout: full-screen 3D canvas; HUD pinned to corners inside safe areas. Single deliberate daytime look. */
:root{
  --ink:#3B2A1E; --ink-soft:#6F5A46; --paper:#FFF8EC; --paper-edge:#E3D3B6;
  --amber:#F29E4C; --amber-deep:#C8762E; --sky:#CDEBF5; --mist:#5E6372;
  --f-ui:"Chiron GoRound TC","PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-ui);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:2;pointer-events:none}
.card{background:var(--paper);border-radius:16px;box-shadow:0 3px 0 var(--paper-edge);padding:8px 12px}
#tl{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
#tl .t1{font-size:12px;color:var(--ink-soft)}
#tl .t2{font-size:17px;font-weight:700}
#tr{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chip{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:6px 12px 6px 8px;border-radius:999px}
.dot{width:14px;height:14px;border-radius:50%}
.toggle{pointer-events:auto;border:0;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.toggle:focus-visible,#act:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#toast{z-index:6;left:50%;bottom:calc(190px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);width:max-content;max-width:min(calc(100vw - 32px),420px);box-sizing:border-box;font-size:15px;line-height:1.55;text-align:center;opacity:0;transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#joy{position:fixed;z-index:3;left:max(24px,calc(env(safe-area-inset-left,0px) + 12px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,248,236,.45);border:3px solid rgba(255,248,236,.9);touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--paper-edge)}
#act{position:fixed;z-index:3;right:max(28px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:0;background:var(--amber);box-shadow:0 5px 0 var(--amber-deep);color:#fff;font:700 19px var(--f-ui);cursor:pointer;touch-action:manipulation}
#act[data-a="none"]{background:#B9AE9C;box-shadow:0 5px 0 #8E846F}
#act[data-a="purify"]{background:#7E5FC4;box-shadow:0 5px 0 #5A4196}
#help{left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:13px;color:var(--ink);background:rgba(255,248,236,.85);border-radius:999px;padding:6px 14px;white-space:nowrap;transition:opacity .6s}
#mini{position:fixed;z-index:3;left:max(12px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));width:112px;height:112px;border-radius:50%;border:4px solid var(--paper);box-shadow:0 3px 0 var(--paper-edge);background:#6EC3DE;cursor:pointer;touch-action:manipulation}
#miniN{position:fixed;z-index:4;left:calc(max(12px,env(safe-area-inset-left,0px)) + 52px);top:calc(78px + env(safe-area-inset-top,0px));width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font:700 10px/18px var(--f-ui);text-align:center;pointer-events:none}
#mapOv{position:fixed;inset:0;z-index:10;background:rgba(36,42,58,.55);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#mapOv[hidden],[hidden]{display:none!important}
#mapBox{position:relative;width:min(100%,640px);height:min(100%,760px);border-radius:24px;overflow:hidden;background:#6EC3DE;border:5px solid var(--paper);box-shadow:0 5px 0 var(--paper-edge)}
#big{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.mbtn{position:absolute;width:48px;height:48px;border-radius:14px;border:0;background:var(--paper);box-shadow:0 3px 0 var(--paper-edge);font:700 22px var(--f-ui);color:var(--ink);cursor:pointer}
.mbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#mapTitle{position:absolute;left:12px;top:12px;font-size:15px;font-weight:700}
#mapHint{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>


<canvas id="c" aria-label="燈芯島 3D 場景"></canvas>

<div class="hud" id="tl">
  <div class="card"><div class="t1" id="clock">春季 · 第 1 天 · 07:00</div><div class="t2" id="region">燈芯島 · 小谷村</div></div>
</div>
<div class="hud" id="tr">
  <div class="card" id="inv" style="display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:13px;font-weight:700;padding:8px 12px"><span id="iMush">蘑菇 0</span><span id="iWood">木材 0</span><span id="iStone">石頭 0</span><span id="iCrys">水晶 0</span></div>
  <div class="card chip"><span class="dot" style="background:#9B7BD4"></span><span id="potN">淨霧藥劑 1</span></div>
  <button class="card toggle" id="curveBtn" type="button">地平線彎曲：開</button>
</div>
<div class="hud card" id="toast" role="status" aria-live="polite"></div>
<div class="hud" id="help">拖曳左下搖桿移動 · 電腦可用 WASD 或方向鍵</div>
<canvas id="mini" aria-label="小地圖，點一下開啟大地圖" role="button" tabindex="0"></canvas><div id="miniN">北</div>
<div id="mapOv" hidden>
  <div id="mapBox">
    <canvas id="big" aria-label="燈芯島地圖，可拖曳與縮放"></canvas>
    <div class="card" id="mapTitle">燈芯島地圖</div>
    <button class="mbtn" id="mClose" type="button" aria-label="關閉地圖" style="right:12px;top:12px">×</button>
    <button class="mbtn" id="mIn" type="button" aria-label="放大" style="right:12px;top:76px">+</button>
    <button class="mbtn" id="mOut" type="button" aria-label="縮小" style="right:12px;top:132px">−</button>
    <button class="mbtn" id="mMe" type="button" aria-label="回到我的位置" style="right:12px;top:188px;font-size:14px">我</button>
    <div class="card" id="mapHint">雙指或滾輪縮放 · 拖曳移動</div>
  </div>
</div>
<div id="joy" aria-label="移動搖桿" role="application"><div id="knob"></div></div>
<button id="act" type="button" data-a="none">互動</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
const SKY=0xCDEBF5;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,95,200);
const camera=new THREE.PerspectiveCamera(42,1,0.1,400);

scene.add(new THREE.HemisphereLight(0xffffff,0x9fbf88,0.65));
const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(12,24,10);scene.add(sun);

// curved-world bend shared by every material
const CURVE=0.006;const curveU={value:CURVE};const colliders=[];const treeDots=[];
function bend(m){
  m.onBeforeCompile=function(sh){
    sh.uniforms.uCurve=curveU;
    sh.vertexShader='uniform float uCurve;\n'+sh.vertexShader.replace('#include <project_vertex>',
      'vec4 mvPosition = modelViewMatrix * vec4( transformed, 1.0 );\n'+
      'float dz = max(0.0, -mvPosition.z - 14.0);\n'+
      'mvPosition.y -= uCurve * dz * dz;\n'+
      'gl_Position = projectionMatrix * mvPosition;');
  };
  return m;
}
const grad=new THREE.DataTexture(new Uint8Array([105,105,105,255,185,185,185,255,255,255,255,255]),3,1,THREE.RGBAFormat);
grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.generateMipmaps=false;grad.needsUpdate=true;
const matCache={};
function toon(c,own){
  if(!own&&matCache[c])return matCache[c];
  const m=bend(new THREE.MeshToonMaterial({color:c,gradientMap:grad}));
  if(!own)matCache[c]=m;return m;
}
const outlineMat=bend(new THREE.MeshBasicMaterial({color:0x3B2A1E,side:THREE.BackSide}));
function part(geo,mat,x,y,z,parent,ol){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
  if(ol!==0){const o=new THREE.Mesh(geo,outlineMat);o.scale.setScalar(1+(ol||0.07));m.add(o);}
  (parent||scene).add(m);return m;
}

// seeded rng
let seed=20261016;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}

// water + island
const water=new THREE.Mesh(new THREE.PlaneGeometry(700,700,1,1),bend(new THREE.MeshToonMaterial({color:0x6EC3DE,gradientMap:grad})));
water.rotation.x=-Math.PI/2;water.position.y=-1.1;scene.add(water);
const R=62;
part(new THREE.CylinderGeometry(R+5,R+7,2.4,56),toon(0xF1DCA4),0,-1.3,0,null,0.015);
part(new THREE.CylinderGeometry(R,R+1.5,2,56),toon(0x8FCB6B),0,-0.99,0,null,0.012);

// region tests
const inForest=(x,z)=>z<-21;
const inCoast=(x,z)=>x>28&&z>-21;

// animatable forest materials
const lerps=[];
function fadeMat(fromHex,toHex){const m=toon(fromHex,true);lerps.push({m,a:new THREE.Color(fromHex),b:new THREE.Color(toHex)});return m;}
const fLeaf=fadeMat(0x8C918F,0x3F8A3F),fLeaf2=fadeMat(0x9AA09C,0x5DAE55),fTrunk=fadeMat(0x6E6A68,0x8A5A36),fFloor=fadeMat(0x7D8380,0x6FB352),fStatue=fadeMat(0x9A9690,0xE0663F);

// forest floor patches
for(let i=0;i<14;i++){
  const a=-Math.PI*0.5+(rnd()-0.5)*2.2, r=30+rnd()*24;
  const x=Math.cos(a)*r, z=Math.sin(a)*r; if(!inForest(x,z))continue;
  const d=new THREE.Mesh(new THREE.CircleGeometry(9+rnd()*6,18),fFloor);d.rotation.x=-Math.PI/2;d.position.set(x,0.03+i*0.002,z);scene.add(d);
}

// trees
const coneG1=new THREE.ConeGeometry(1.7,3,7),coneG2=new THREE.ConeGeometry(1.25,2.4,7),trunkG=new THREE.CylinderGeometry(0.28,0.38,1.6,6);
const trees=[];
function ownMat(base,forest){const m=bend(base.clone());m.transparent=false;if(forest){const L=lerps.find(l=>l.m===base);lerps.push({m,a:L.a,b:L.b});}return m;}
function tree(x,z,forest){
  const g=new THREE.Group();g.position.set(x,0,z);const s=0.8+rnd()*0.6;g.scale.setScalar(s);g.rotation.y=rnd()*6;
  const mT=ownMat(forest?fTrunk:toon(0x8A5A36),forest),m1=ownMat(forest?fLeaf:toon(0x4E9E4A),forest),m2=ownMat(forest?fLeaf2:toon(0x5DAE55),forest);
  const trunk=part(trunkG,mT,0,0.8,0,g,0.12),c1=part(coneG1,m1,0,2.8,0,g,0.07),c2=part(coneG2,m2,0,4.1,0,g,0.08);
  const col={x,z,r:0.75*s};
  scene.add(g);colliders.push(col);treeDots.push({x,z,f:forest});
  trees.push({g,x,z,s,forest,trunk,crown:[c1,c2],mats:[mT,m1,m2],outlines:[trunk,c1,c2].map(m=>m.children[0]),alpha:1,hits:0,state:'up',t:0,col,rotY:g.rotation.y});
}
let placed=0;
while(placed<64){
  const a=rnd()*Math.PI*2, r=18+rnd()*41; const x=Math.cos(a)*r, z=Math.sin(a)*r;
  if(Math.hypot(x-9,z-4)<8||Math.hypot(x,z+13)<8)continue;
  if(inCoast(x,z)&&rnd()<0.6)continue;
  tree(x,z,inForest(x,z));placed++;
}
// extra forest density
for(let i=0;i<22;i++){const x=(rnd()-0.5)*80,z=-24-rnd()*34;if(Math.hypot(x,z)>R-4)continue;tree(x,z,true);}

// rocks
const rocks=[];
const rockG=new THREE.DodecahedronGeometry(1,0);
for(let i=0;i<16;i++){const a=rnd()*Math.PI*2,r=14+rnd()*44;const x=Math.cos(a)*r,z=Math.sin(a)*r;const rm=bend(toon(0xA9A39A).clone());const m=part(rockG,rm,x,0.4,z,null,0.08);const sx=0.8+rnd(),sy=0.6+rnd()*0.6,sz=0.8+rnd();m.scale.set(sx,sy,sz);colliders.push({x,z,r:Math.max(sx,sz)*0.95});m.rotation.set(rnd(),rnd()*6,rnd());rocks.push({m,x,z,sc:[sx,sy,sz],r:Math.max(sx,sz),hits:0,state:'full',t:0,mat:rm});}

// workshop house + cauldron
const house=new THREE.Group();house.position.set(9,0,4);house.rotation.y=-0.5;scene.add(house);
part(new THREE.BoxGeometry(5,3.2,4.2),toon(0xF3E3C3),0,1.6,0,house,0.04);
const roof=part(new THREE.ConeGeometry(4.3,2.6,4),toon(0xD9694F),0,4.5,0,house,0.05);roof.rotation.y=Math.PI/4;
part(new THREE.BoxGeometry(1.1,1.9,0.2),toon(0x8A5A36),0,0.95,2.15,house,0.06);
part(new THREE.BoxGeometry(0.9,0.9,0.2),toon(0x9FD6EC),1.6,2.1,2.15,house,0.08);
const caul=new THREE.Group();caul.position.set(4.2,0,7.5);scene.add(caul);colliders.push({x:4.2,z:7.5,r:1.0});
part(new THREE.SphereGeometry(0.9,12,10),toon(0x4A4458),0,0.8,0,caul,0.08);
const brew=new THREE.Mesh(new THREE.CircleGeometry(0.72,16),bend(new THREE.MeshBasicMaterial({color:0xB9A3E6})));brew.rotation.x=-Math.PI/2;brew.position.y=1.42;caul.add(brew);

// lantern tree
const lt=new THREE.Group();lt.position.set(0,0,-13);scene.add(lt);colliders.push({x:0,z:-13,r:1.5});
part(new THREE.CylinderGeometry(0.9,1.4,6,8),toon(0x7A5236),0,3,0,lt,0.06);
part(new THREE.IcosahedronGeometry(3.6,0),toon(0x7FBF5A),0,7.2,0,lt,0.05);
part(new THREE.IcosahedronGeometry(2.4,0),toon(0x9ED67A),1.8,8.6,0.6,lt,0.06);
const glowMat=bend(new THREE.MeshBasicMaterial({color:0xFFE08A,transparent:true,opacity:0.9}));
const lanterns=[];
for(let i=0;i<7;i++){const a=i/7*Math.PI*2;const m=new THREE.Mesh(new THREE.SphereGeometry(0.32,10,8),glowMat);m.position.set(Math.cos(a)*3.3,6+Math.sin(i*1.7)*1.2,Math.sin(a)*3.3);lt.add(m);lanterns.push(m);}

// flowers
const fG=new THREE.SphereGeometry(0.18,6,5);
for(let i=0;i<60;i++){const a=rnd()*Math.PI*2,r=4+rnd()*18;const x=Math.cos(a)*r,z=Math.sin(a)*r;if(inForest(x,z))continue;const m=new THREE.Mesh(fG,toon([0xF4A6C0,0xF7D154,0xFFFFFF][i%3]));m.position.set(x,0.18,z);scene.add(m);}

// pier
for(let i=0;i<7;i++)part(new THREE.BoxGeometry(3,0.3,1.4),toon(0xB07A4A),0,-0.25,R-1+i*1.6,null,0.05);

// spirit statue in forest
const spirit=new THREE.Group();spirit.position.set(2,0,-36);scene.add(spirit);colliders.push({x:2,z:-36,r:1.7});
part(new THREE.SphereGeometry(1.1,12,10),fStatue,0,1.1,0,spirit,0.07);
const earL=part(new THREE.ConeGeometry(0.35,1.1,6),fStatue,-0.55,2.2,0,spirit,0.1);earL.rotation.z=0.4;
const earR=part(new THREE.ConeGeometry(0.35,1.1,6),fStatue,0.55,2.2,0,spirit,0.1);earR.rotation.z=-0.4;
part(new THREE.CylinderGeometry(1.4,1.6,0.5,10),toon(0x8F8A84),0,0.25,0,spirit,0.05).position.y=-0.0;

// mist: soft camera-facing sprites, grey-violet so it reads apart from the blue distance haze
function bendSprite(m){
  m.onBeforeCompile=function(sh){
    sh.uniforms.uCurve=curveU;
    sh.vertexShader='uniform float uCurve;\n'+sh.vertexShader.replace('gl_Position = projectionMatrix * mvPosition;',
      'float dz = max(0.0, -mvPosition.z - 14.0);\nmvPosition.y -= uCurve * dz * dz;\ngl_Position = projectionMatrix * mvPosition;');
  };return m;
}
const puffTex=(function(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const r=g.createRadialGradient(64,64,4,64,64,62);r.addColorStop(0,'rgba(255,255,255,0.95)');r.addColorStop(0.45,'rgba(255,255,255,0.55)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(c);return t;})();
function mistSet(test,count,color){
  const mat=bendSprite(new THREE.SpriteMaterial({map:puffTex,color,transparent:true,opacity:0.8,depthWrite:false,fog:false}));
  const arr=[];let n=0,guard=0;
  while(n<count&&guard++<8000){
    const x=(rnd()-0.5)*2*R,z=(rnd()-0.5)*2*R;
    if(Math.hypot(x,z)>R+3||!test(x,z))continue;
    const m=new THREE.Sprite(mat);const s=7+rnd()*9;m.scale.set(s*1.5,s,1);m.position.set(x,1+rnd()*4.5,z);m.userData={bx:x,bz:z,ph:rnd()*6,s};scene.add(m);arr.push(m);n++;
  }
  return {mat,arr};
}
const forestMist=mistSet(inForest,150,0x9E9AB0);
const coastMist=mistSet(inCoast,80,0x9A97AB);

// mushrooms
const mushes=[];
const capG=new THREE.SphereGeometry(0.5,10,6,0,Math.PI*2,0,Math.PI/2),stemG=new THREE.CylinderGeometry(0.18,0.22,0.45,8);
for(let i=0;i<12;i++){
  let x,z;do{const a=rnd()*Math.PI*2,r=6+rnd()*22;x=Math.cos(a)*r;z=Math.sin(a)*r;}while(inForest(x,z)||Math.hypot(x-9,z-4)<5||Math.hypot(x,z+13)<5);
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  part(stemG,toon(0xF6EAD2),0,0.22,0,g,0.15);part(capG,toon(0xE8584A),0,0.42,0,g,0.1);
  mushes.push({g,x,z,alive:true});
}

// player
const player=new THREE.Group();player.position.set(-3,0,20);scene.add(player);
const body=new THREE.Group();player.add(body);
part(new THREE.CylinderGeometry(0.42,0.85,1.3,10),toon(0x2F7F86),0,0.75,0,body,0.07);
part(new THREE.CylinderGeometry(0.44,0.44,0.18,10),toon(0xF29E4C),0,0.55,0,body,0.05);
part(new THREE.SphereGeometry(0.55,14,12),toon(0xF6D7B8),0,1.85,0,body,0.07);
const hair=part(new THREE.SphereGeometry(0.6,14,10,0,Math.PI*2,0,Math.PI*0.55),toon(0x6B3F26),0,1.92,-0.04,body,0.06);hair.rotation.x=-0.25;
const eyeG=new THREE.SphereGeometry(0.07,6,5),eyeM=new THREE.MeshBasicMaterial({color:0x3B2A1E});bend(eyeM);
[-0.2,0.2].forEach(x=>{const e=new THREE.Mesh(eyeG,eyeM);e.position.set(x,1.86,0.5);body.add(e);});
const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.8,16),bend(new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.18,depthWrite:false})));shadow.rotation.x=-Math.PI/2;shadow.position.y=0.04;player.add(shadow);

// lantern moth
const moth=new THREE.Group();scene.add(moth);
moth.add(new THREE.Mesh(new THREE.SphereGeometry(0.16,10,8),bend(new THREE.MeshBasicMaterial({color:0xFFE9A0}))));
const wingM=bend(new THREE.MeshBasicMaterial({color:0xF7C26B,side:THREE.DoubleSide,transparent:true,opacity:0.9}));
const wL=new THREE.Mesh(new THREE.CircleGeometry(0.28,10),wingM),wR=wL.clone();wL.position.x=-0.24;wR.position.x=0.24;moth.add(wL,wR);

// purify ring
const ring=new THREE.Mesh(new THREE.RingGeometry(0.9,1.3,40),bend(new THREE.MeshBasicMaterial({color:0xE9DBFF,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false})));
ring.rotation.x=-Math.PI/2;ring.position.y=0.2;scene.add(ring);

// ---- UI ----
const $=id=>document.getElementById(id);
const toastEl=$('toast');let toastT=0;
function toast(msg,ms){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),ms||2800);}
let inv={mush:0,wood:0,stone:0,crys:0};function invUI(){$('iMush').textContent='蘑菇 '+inv.mush;$('iWood').textContent='木材 '+inv.wood;$('iStone').textContent='石頭 '+inv.stone;$('iCrys').textContent='水晶 '+inv.crys;}
let potN=1,purified=false,purifyT=-1,curveOn=true;
$('curveBtn').addEventListener('click',()=>{curveOn=!curveOn;curveU.value=curveOn?CURVE:0;$('curveBtn').textContent='地平線彎曲：'+(curveOn?'開':'關');});
setTimeout(()=>{$('help').style.opacity=0;},7000);

// joystick + keys
const joy=$('joy'),knob=$('knob');let jx=0,jy=0,jid=null;
function jmove(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const max=r.width/2-18,m=Math.hypot(dx,dy);if(m>max){dx*=max/m;dy*=max/m;}knob.style.transform='translate('+dx+'px,'+dy+'px)';jx=dx/max;jy=dy/max;}
function jend(e){if(e.pointerId!==jid)return;jid=null;jx=jy=0;knob.style.transform='';}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;try{joy.setPointerCapture(e.pointerId);}catch(_){}jmove(e);});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e);});
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key==='Enter'){if(document.activeElement!==$('act'))doAction();}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

const actBtn=$('act');let ctx={a:'none'};
actBtn.addEventListener('click',doAction);
function doAction(){
  const a=ctx.a;
  if(a==='pick'){const m=ctx.m;m.alive=false;scene.remove(m.g);inv.mush++;invUI();toast('採到紅帽蘑菇！明天早上會再長出來。',1800);}
  else if(a==='chop'){const t=ctx.t;t.hits++;t.t=0.32;if(t.hits>=3){t.state='falling';t.t=0;inv.wood+=3;invUI();toast('砍倒了！木材 +3。樹樁明天會再長成樹。',1800);}else{toast('咚！再砍 '+(3-t.hits)+' 下。',900);}}
  else if(a==='mine'){const r=ctx.r;r.hits++;r.t=0.25;inv.stone++;let msg='石頭 +1';if(Math.random()<0.25){inv.crys++;msg+='，還敲出了藍水晶！';}if(r.hits>=3){r.state='empty';msg+=' 這塊石頭今天敲不出東西了。';}invUI();toast(msg,1600);}
  else if(a==='purify'){potN--;$('potN').textContent='淨霧藥劑 '+potN;purifyT=0;ring.position.set(player.position.x,0.2,player.position.z);toast('把淨霧藥劑灑向灰霧……',2200);}
  else if(a==='tree'){toast('燈芯樹微微發著光。啾燈：「這是大媽媽，整座島的心臟喔！」',3600);}
  else if(a==='spirit'){toast('火苔精：「呼啊……睡了好久。你身上有大媽媽的光呢。」',3800);}
  else if(a==='blocked'){toast(ctx.msg,2600);}
}

// clock
let gameMin=7*60;
function fmtClock(){const h=Math.floor(gameMin/60)%24,m=Math.floor(gameMin%60);return '春季 · 第 1 天 · '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}

// ---- maps ----
const mini=$('mini'),big=$('big'),mapOv=$('mapOv');
const LABELS=[['小谷村',-6,6],['燈芯樹',0,-17],['火苔之森',0,-42],['潮汐海岸',45,4],['工坊',9,-1],['碼頭',0,58]];
function drawMap(ctx,w,h,cx,cz,sc,full){
  const X=x=>w/2+(x-cx)*sc,Y=z=>h/2+(z-cz)*sc;
  ctx.clearRect(0,0,w,h);ctx.fillStyle='#6EC3DE';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#F1DCA4';ctx.beginPath();ctx.arc(X(0),Y(0),(R+5)*sc,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(X(0),Y(0),R*sc,0,7);ctx.clip();
  ctx.fillStyle='#8FCB6B';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#A9DB86';ctx.beginPath();ctx.arc(X(-2),Y(4),17*sc,0,7);ctx.fill();
  const fog='#A5A2B6';
  ctx.fillStyle=purified?'#5E9E4A':fog;ctx.fillRect(0,0,w,Y(-21));
  ctx.fillStyle=fog;ctx.fillRect(X(28),Y(-21),w,h);
  treeDots.forEach(t=>{ctx.fillStyle=t.f&&!purified?'#8E8C9C':'#3F8A3F';ctx.beginPath();ctx.arc(X(t.x),Y(t.z),Math.max(1.2,1.1*sc),0,7);ctx.fill();});
  ctx.restore();
  ctx.fillStyle='#B07A4A';ctx.fillRect(X(-1.5),Y(R-2),3*sc,11*sc);
  ctx.save();ctx.translate(X(9),Y(4));ctx.rotate(0.5);ctx.fillStyle='#D9694F';ctx.fillRect(-2.5*sc,-2.1*sc,5*sc,4.2*sc);ctx.restore();
  ctx.fillStyle='#F7D154';ctx.strokeStyle='#C99A1E';ctx.lineWidth=2;ctx.beginPath();ctx.arc(X(0),Y(-13),Math.max(4,2.6*sc),0,7);ctx.fill();ctx.stroke();
  if(purified){ctx.fillStyle='#E0663F';ctx.beginPath();ctx.arc(X(2),Y(-36),Math.max(3,1.6*sc),0,7);ctx.fill();}
  mushes.forEach(m=>{if(!m.alive)return;ctx.fillStyle='#E8584A';ctx.beginPath();ctx.arc(X(m.x),Y(m.z),Math.max(2,0.8*sc),0,7);ctx.fill();});
  if(full){
    ctx.font='700 '+Math.round(13+sc*0.6)+'px '+getComputedStyle(document.body).fontFamily;ctx.textAlign='center';ctx.textBaseline='middle';
    LABELS.forEach(([t,x,z])=>{let txt=t;if((t==='火苔之森'&&!purified)||t==='潮汐海岸')txt=t+'（灰霧）';const tw=ctx.measureText(txt).width+16;ctx.fillStyle='rgba(255,248,236,.92)';ctx.beginPath();ctx.roundRect?ctx.roundRect(X(x)-tw/2,Y(z)-13,tw,26,13):ctx.rect(X(x)-tw/2,Y(z)-13,tw,26);ctx.fill();ctx.fillStyle='#3B2A1E';ctx.fillText(txt,X(x),Y(z)+1);});
  }
  const p=player.position,r=player.rotation.y,px=X(p.x),py=Y(p.z),dx=Math.sin(r),dy=Math.cos(r),k=full?11:8;
  ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(px,py,k*0.85,0,7);ctx.fill();
  ctx.fillStyle='#F29E4C';ctx.beginPath();ctx.moveTo(px+dx*k,py+dy*k);ctx.lineTo(px-dy*k*0.6-dx*k*0.5,py+dx*k*0.6-dy*k*0.5);ctx.lineTo(px+dy*k*0.6-dx*k*0.5,py-dx*k*0.6-dy*k*0.5);ctx.closePath();ctx.fill();
}
function fitCanvas(c){const d=Math.min(window.devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return [ctx,w,h];}
let mapOpen=false,mapZ=1,mcx=0,mcz=0;
function baseScale(){return Math.min(big.clientWidth,big.clientHeight)/(2*(R+8));}
function openMap(){mapOpen=true;mapOv.hidden=false;mapZ=1;mcx=0;mcz=0;jx=jy=0;knob.style.transform='';}
function closeMap(){mapOpen=false;mapOv.hidden=true;}
function clampMap(){mapZ=Math.min(5,Math.max(1,mapZ));const lim=R+8;mcx=Math.max(-lim,Math.min(lim,mcx));mcz=Math.max(-lim,Math.min(lim,mcz));}
mini.addEventListener('click',openMap);mini.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMap();}});
$('mClose').addEventListener('click',closeMap);
$('mIn').addEventListener('click',()=>{mapZ*=1.4;clampMap();});
$('mOut').addEventListener('click',()=>{mapZ/=1.4;clampMap();});
$('mMe').addEventListener('click',()=>{mcx=player.position.x;mcz=player.position.z;});
mapOv.addEventListener('click',e=>{if(e.target===mapOv)closeMap();});
addEventListener('keydown',e=>{if(e.key==='Escape'&&mapOpen)closeMap();if((e.key==='m'||e.key==='M')&&!mapOpen)openMap();});
const ptrs=new Map();let pinch0=0,z0=1;
big.addEventListener('pointerdown',e=>{try{big.setPointerCapture(e.pointerId);}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);z0=mapZ;}});
big.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);const cur={x:e.clientX,y:e.clientY};ptrs.set(e.pointerId,cur);
  if(ptrs.size===1){const s=baseScale()*mapZ;mcx-=(cur.x-prev.x)/s;mcz-=(cur.y-prev.y)/s;}
  else if(ptrs.size===2&&pinch0>0){const [a,b]=[...ptrs.values()];mapZ=z0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0;}
  clampMap();});
const endP=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;};
big.addEventListener('pointerup',endP);big.addEventListener('pointercancel',endP);
big.addEventListener('wheel',e=>{e.preventDefault();mapZ*=e.deltaY<0?1.12:1/1.12;clampMap();},{passive:false});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?50:40;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const camPos=new THREE.Vector3(-3,21,38),camLook=new THREE.Vector3();
let wasHit=false,bumpT=0;let last=performance.now(),walk=0,blockedAt=0,lastRegion='';
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  gameMin+=dt*1.6;$('clock').textContent=fmtClock();

  // move
  let mx=jx,mz=jy;
  if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;
  if(keys['w']||keys['arrowup'])mz-=1;if(keys['s']||keys['arrowdown'])mz+=1;
  if(mapOpen){mx=0;mz=0;}
  const ml=Math.hypot(mx,mz);
  const p=player.position;
  if(ml>0.08){
    const sp=7.5*Math.min(1,ml);mx/=ml;mz/=ml;
    let nx=p.x+mx*sp*dt,nz=p.z+mz*sp*dt;
    let msg='';
    if(!purified&&inForest(nx,nz)){nz=-21;msg='灰霧太濃了，進不去。要用淨霧藥劑才行。';}
    if(inCoast(nx,nz)&&nz>-21){nx=28;msg='潮汐海岸的灰霧，要等到第二章才能淨化。';}
    const r=Math.hypot(nx,nz);if(r>R-1.5){nx*=(R-1.5)/r;nz*=(R-1.5)/r;}
    if(msg&&now-blockedAt>3000){toast(msg,2400);blockedAt=now;}
    const PR=0.55;let hit=false;
    for(let it=0;it<2;it++){
      for(const c of colliders){const dx=nx-c.x,dz=nz-c.z,d=Math.hypot(dx,dz),md=c.r+PR;if(d<md&&d>1e-4){nx=c.x+dx/d*md;nz=c.z+dz/d*md;hit=true;}}
      // workshop house: rotated box
      const hr=house.rotation.y,cs=Math.cos(hr),sn=Math.sin(hr);
      const rx=nx-house.position.x,rz=nz-house.position.z;
      let lx=rx*cs-rz*sn,lz=rx*sn+rz*cs;const hx=2.5+PR,hz=2.1+PR;
      if(Math.abs(lx)<hx&&Math.abs(lz)<hz){hit=true;const px=hx-Math.abs(lx),pz=hz-Math.abs(lz);if(px<pz)lx=Math.sign(lx||1)*hx;else lz=Math.sign(lz||1)*hz;
        nx=house.position.x+lx*cs+lz*sn;nz=house.position.z-lx*sn+lz*cs;}
    }
    if(hit&&!wasHit){bumpT=0.18;}
    wasHit=hit;
    p.x=nx;p.z=nz;
    player.rotation.y=Math.atan2(mx,mz);walk+=dt*12;
    body.position.y=Math.abs(Math.sin(walk))*0.14;
  }else{body.position.y*=0.8;wasHit=false;}
  if(bumpT>0){bumpT-=dt;const k=Math.max(0,bumpT)/0.18;body.scale.set(1+0.18*k,1-0.16*k,1+0.18*k);}else body.scale.set(1,1,1);

  // camera
  camPos.lerp(new THREE.Vector3(p.x,p.y+21,p.z+18),1-Math.pow(0.002,dt));
  camera.position.copy(camPos);camLook.set(p.x,p.y+1,p.z-3);camera.lookAt(camLook);

  // moth
  moth.position.set(p.x+Math.cos(t*1.3)*1.4,2.6+Math.sin(t*2.1)*0.3,p.z+Math.sin(t*1.3)*1.4);
  const fl=Math.sin(t*22)*0.9;wL.rotation.y=fl;wR.rotation.y=-fl;

  // ambient
  lanterns.forEach((l,i)=>{l.scale.setScalar(1+Math.sin(t*2+i)*0.15);});
  brew.material.color.setHSL(0.72,0.55,0.72+Math.sin(t*3)*0.05);
  const drift=m=>{const u=m.userData;m.position.x=u.bx+Math.sin(t*0.4+u.ph)*1.5;m.position.z=u.bz+Math.cos(t*0.3+u.ph)*1.2;};
  coastMist.arr.forEach(drift);
  if(forestMist.mat.opacity>0.001)forestMist.arr.forEach(drift);

  // purify animation
  if(purifyT>=0){
    purifyT+=dt;const k=Math.min(1,purifyT/2.6),e=k*k*(3-2*k);
    ring.material.opacity=(1-k)*0.85;ring.scale.setScalar(1+e*40);
    forestMist.mat.opacity=0.8*(1-e);forestMist.arr.forEach(m=>{const s=m.userData.s*(1+e*0.8);m.scale.set(s*1.5,s,1);m.position.y+=dt*1.5;});
    lerps.forEach(l=>l.m.color.copy(l.a).lerp(l.b,e));
    if(k>=1){purifyT=-1;purified=true;forestMist.arr.forEach(m=>{m.visible=false;});toast('火苔之森淨化完成！灰霧變成了白霧，沉睡的火苔精醒來了。',4200);}
  }
  if(purified){spirit.position.y=Math.abs(Math.sin(t*3))*0.35;spirit.rotation.y=Math.sin(t)*0.4;}

  // trees: occlusion fade + chop animation
  trees.forEach(t=>{
    const dz=t.z-p.z,dx=Math.abs(t.x-p.x);
    const occl=t.state==='up'&&dz>-0.5&&dz<7&&dx<2.3*t.s;
    const target=occl?0.28:1;t.alpha+=(target-t.alpha)*Math.min(1,dt*8);
    const fading=t.alpha<0.97;
    t.mats.forEach(m=>{if(m.transparent!==fading){m.transparent=fading;m.depthWrite=!fading;m.needsUpdate=true;}m.opacity=fading?t.alpha:1;});
    t.outlines.forEach(o=>{o.visible=!fading;});
    if(t.state==='up'){if(t.t>0){t.t-=dt;t.g.rotation.z=Math.sin(t.t*60)*0.06*(t.t/0.32);}else t.g.rotation.z=0;}
    else if(t.state==='falling'){t.t+=dt;const k=Math.min(1,t.t/0.7);t.g.rotation.z=k*k*1.45;if(k>=1){t.state='stump';t.t=0;t.g.rotation.z=0;t.crown.forEach(c=>c.visible=false);t.trunk.scale.y=0.35;t.trunk.position.y=0.28;t.col.r=0.42*t.s;}}
    else if(t.state==='stump'){t.t+=dt;if(t.t>45){t.state='up';t.hits=0;t.crown.forEach(c=>{c.visible=true;});t.trunk.scale.y=1;t.trunk.position.y=0.8;t.col.r=0.75*t.s;}}
  });
  rocks.forEach(r=>{
    if(r.t>0){r.t-=dt;const k=r.t/0.25;r.m.position.x=r.x+Math.sin(r.t*90)*0.08*k;}else r.m.position.x=r.x;
    if(r.state==='empty'){r.m.scale.set(r.sc[0]*0.6,r.sc[1]*0.5,r.sc[2]*0.6);r.mat.color.setHex(0x8C877F);r.regrow=(r.regrow||0)+dt;if(r.regrow>45){r.state='full';r.hits=0;r.regrow=0;r.m.scale.set(r.sc[0],r.sc[1],r.sc[2]);r.mat.color.setHex(0xA9A39A);}}
  });

  // region label
  let reg='燈芯島 · 小谷村';
  if(p.z<-17)reg=purified?'火苔之森':'火苔之森（灰霧）';
  else if(p.x>22)reg='潮汐海岸（灰霧）';
  else if(Math.hypot(p.x,p.z+13)<9)reg='燈芯樹';
  if(reg!==lastRegion){$('region').textContent=reg;lastRegion=reg;}

  // context action
  let best=null,bd=2.4;mushes.forEach(m=>{if(!m.alive)return;const d=Math.hypot(m.x-p.x,m.z-p.z);if(d<bd){bd=d;best=m;}});
  let bt=null,btd=1e9;trees.forEach(t=>{if(t.state!=='up'||(t.forest&&!purified))return;const d=Math.hypot(t.x-p.x,t.z-p.z)-t.col.r;if(d<1.3&&d<btd){btd=d;bt=t;}});
  let br=null,brd=1e9;rocks.forEach(r=>{if(r.state!=='full')return;const d=Math.hypot(r.x-p.x,r.z-p.z)-r.r;if(d<1.3&&d<brd){brd=d;br=r;}});
  if(best)ctx={a:'pick',m:best,label:'採集'};
  else if(br&&(!bt||brd<btd))ctx={a:'mine',r:br,label:'敲石頭'};
  else if(bt)ctx={a:'chop',t:bt,label:'砍樹'};
  else if(!purified&&purifyT<0&&p.z<-17&&potN>0)ctx={a:'purify',label:'淨霧'};
  else if(purified&&Math.hypot(p.x-spirit.position.x,p.z-spirit.position.z)<4)ctx={a:'spirit',label:'對話'};
  else if(Math.hypot(p.x,p.z+13)<6)ctx={a:'tree',label:'觀察'};
  else ctx={a:'none',label:'互動'};
  if(actBtn.dataset.a!==ctx.a){actBtn.dataset.a=ctx.a;actBtn.textContent=ctx.label;}

  {const [c,w,h]=fitCanvas(mini);drawMap(c,w,h,player.position.x,player.position.z,1.15,false);}
  if(mapOpen){const [c,w,h]=fitCanvas(big);drawMap(c,w,h,mcx,mcz,baseScale()*mapZ,true);}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(()=>toast('往北走（畫面上方）到灰霧邊緣，用淨霧藥劑淨化火苔之森。',4200),900);
})();
</script>
