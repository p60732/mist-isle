<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>燈芯島 3D 地圖試玩</title>

<style>
/* Layout: full-screen 3D canvas; HUD pinned to corners inside safe areas. Single deliberate daytime look. */
:root{
  --ink:#3B2A1E; --ink-soft:#6F5A46; --paper:#FFF8EC; --paper-edge:#E3D3B6;
  --amber:#F29E4C; --amber-deep:#C8762E; --sky:#CDEBF5; --mist:#5E6372;
  --f-ui:"Chiron GoRound TC","PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-ui);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:2;pointer-events:none}
.card{background:var(--paper);border-radius:16px;box-shadow:0 3px 0 var(--paper-edge);padding:8px 12px}
#tl{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
#tl .t1{font-size:12px;color:var(--ink-soft)}
#tl .t2{font-size:17px;font-weight:700}
#tr{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chip{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:6px 12px 6px 8px;border-radius:999px}
.dot{width:14px;height:14px;border-radius:50%}
.toggle{pointer-events:auto;border:0;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.toggle:focus-visible,#act:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#toast{z-index:6;left:50%;bottom:calc(232px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);width:max-content;max-width:min(calc(100vw - 32px),420px);box-sizing:border-box;font-size:15px;line-height:1.55;text-align:center;opacity:0;transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#joy{position:fixed;z-index:3;left:max(24px,calc(env(safe-area-inset-left,0px) + 12px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,248,236,.45);border:3px solid rgba(255,248,236,.9);touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--paper-edge)}
#act{position:fixed;z-index:3;right:max(28px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:0;background:var(--amber);box-shadow:0 5px 0 var(--amber-deep);color:#fff;font:700 19px var(--f-ui);cursor:pointer;touch-action:manipulation}
#act2{position:fixed;z-index:3;right:max(124px,calc(env(safe-area-inset-right,0px) + 116px));bottom:calc(112px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;border:0;background:#6DBB58;box-shadow:0 4px 0 #3F8A3A;color:#fff;font:700 15px var(--f-ui);cursor:pointer;touch-action:manipulation}
body.laying #act2{display:none!important}
#act[data-a="none"]{background:#B9AE9C;box-shadow:0 5px 0 #8E846F}
#act[data-a="purify"]{background:#7E5FC4;box-shadow:0 5px 0 #5A4196}
#mini{position:fixed;z-index:3;left:max(12px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));width:112px;height:112px;border-radius:50%;border:4px solid var(--paper);box-shadow:0 3px 0 var(--paper-edge);background:#6EC3DE;cursor:pointer;touch-action:manipulation}
#miniN{position:fixed;z-index:4;left:calc(max(12px,env(safe-area-inset-left,0px)) + 52px);top:calc(78px + env(safe-area-inset-top,0px));width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font:700 10px/18px var(--f-ui);text-align:center;pointer-events:none}
#mapOv{position:fixed;inset:0;z-index:10;background:rgba(36,42,58,.55);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#mapOv[hidden],[hidden]{display:none!important}
#mapBox{position:relative;width:min(100%,640px);height:min(100%,760px);border-radius:24px;overflow:hidden;background:#6EC3DE;border:5px solid var(--paper);box-shadow:0 5px 0 var(--paper-edge)}
#big{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.mbtn{position:absolute;width:48px;height:48px;border-radius:14px;border:0;background:var(--paper);box-shadow:0 3px 0 var(--paper-edge);font:700 22px var(--f-ui);color:var(--ink);cursor:pointer}
.mbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#mapTitle{position:absolute;left:12px;top:12px;font-size:15px;font-weight:700}
#mapHint{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--ink-soft)}
#tr .money{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;border-radius:999px;padding:6px 14px 6px 8px}
#tr .sta{display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 10px;font-size:12px;color:var(--ink-soft)}
#staBar{width:86px;height:10px;border-radius:5px;background:#EADCC2;overflow:hidden}#staFill{height:10px;background:#6DBB58;width:100%;transition:width .3s}
#side{position:fixed;z-index:3;right:max(12px,env(safe-area-inset-right,0px));top:calc(112px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px}
.sbtn{position:relative;width:58px;height:58px;border-radius:18px;border:0;background:var(--paper);box-shadow:0 3px 0 var(--paper-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 11px var(--f-ui);color:var(--ink);cursor:pointer;padding:0}
.sbtn:focus-visible,.slot:focus-visible,.pbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.badge{position:absolute;top:-6px;right:-8px;padding:0 6px;border-radius:9px;background:#F7C948;font-size:10px;line-height:17px}
#hotbar{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(168px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.slot{position:relative;width:52px;height:52px;border-radius:14px;border:3px solid transparent;background:var(--paper);box-shadow:0 3px 0 var(--paper-edge);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.slot.empty{opacity:.55;cursor:default}
.slot .n{position:absolute;right:4px;bottom:1px;font:700 11px var(--f-ui);color:var(--ink)}
.slot .dur{position:absolute;left:6px;right:6px;bottom:4px;height:4px;border-radius:2px;background:#EADCC2;overflow:hidden}.slot .dur i{display:block;height:4px;background:#6DBB58}
.slot.used{border-color:var(--amber)}
#act[data-a="need"]{background:#B9AE9C;box-shadow:0 5px 0 #8E846F}
#panel{position:fixed;inset:0;z-index:9;background:rgba(36,42,58,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:min(100%,520px);max-height:78%;overflow:auto;background:#F6EBD6;border-radius:26px 26px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
#sheet h2{margin:0;font-size:20px}
.shead{display:flex;justify-content:space-between;align-items:center}
#sheet>.shead{position:sticky;top:-16px;z-index:2;background:#F6EBD6;margin:-16px -16px 6px -16px;padding:14px 16px 8px 16px}
.pbtn{white-space:nowrap;min-width:64px;border:0;border-radius:14px;background:var(--paper);box-shadow:0 3px 0 var(--paper-edge);font:700 15px var(--f-ui);color:var(--ink);cursor:pointer;min-height:44px;padding:0 14px}
.pbtn.go{background:var(--amber);box-shadow:0 3px 0 var(--amber-deep);color:#fff}
.pbtn[disabled]{background:#CFC6B5;box-shadow:none;color:#fff;cursor:default}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cell{position:relative;aspect-ratio:1/1;border-radius:16px;background:var(--paper);box-shadow:0 3px 0 var(--paper-edge);border:3px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cell.on{border-color:var(--amber)}
.cell .n{position:absolute;right:6px;bottom:3px;font:700 12px var(--f-ui);color:var(--ink)}
.info{background:var(--paper);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.6}
.rec{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 var(--paper-edge)}
.rec .ic{width:48px;height:48px;border-radius:14px;background:#F6EBD6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rec .tx{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rec .nm{font-weight:700;font-size:16px}.rec .need{font-size:12px;color:var(--ink-soft)}
.ok{color:#2F6B2A;font-weight:700}.lack{color:#B4372B;font-weight:700}
.note{font-size:12px;color:var(--ink-soft)}
/* panel fields: framed slots with category tints */
#sheet{border-top:4px solid #3F3A52}
.sec.st-metal{background:#7A6A55}.rec.st-metal{background:#F4F0EA;border-color:#CFC6B6}.rec.st-metal .ic{background:#DDD5C6}
.sec{display:inline-block;margin:10px 0 2px;padding:3px 12px;border-radius:999px;font-weight:700;font-size:13px;color:#FFF8EC;background:#3F3A52}
.sec.st-bench{background:#B8702A}.sec.st-caul{background:#3E7F78}.sec.st-loom{background:#6F5AA8}
.rec{border:2px solid #E9D9BD;box-shadow:0 3px 0 var(--paper-edge),inset 0 0 0 3px #FFFDF6}
.rec.st-bench{background:#FFF1DC;border-color:#EBC995}
.rec.st-caul{background:#E9F5F2;border-color:#A9D5CD}
.rec.st-loom{background:#F1EDFA;border-color:#C9BDE8}
.rec.st-bench .ic{background:#F9DDB0}.rec.st-caul .ic{background:#CBE8E1}.rec.st-loom .ic{background:#DDD3F2}
.rec .ic{border:2px solid rgba(59,42,30,.12)}
.cell{box-shadow:0 3px 0 var(--paper-edge),inset 0 0 0 2px #FFFDF6;border:2px solid #E9D9BD}
#lay{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#F6EBD6;border-radius:24px 24px 0 0;box-shadow:0 -3px 0 var(--paper-edge);padding:12px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
#lay .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#lay .mode.on{background:var(--amber);color:#fff;box-shadow:0 3px 0 var(--amber-deep)}
#layItems{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fi{flex-shrink:0;width:66px;height:66px;border-radius:14px;border:3px solid transparent;background:var(--paper);box-shadow:0 3px 0 var(--paper-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 11px var(--f-ui);color:var(--ink);cursor:pointer;padding:0;position:relative}
.fi.on{border-color:var(--amber)}.fi .n{position:absolute;right:5px;top:3px;font-size:11px}
body.laying #joy,body.laying #act,body.laying #hotbar,body.laying #side,body.laying #mini,body.laying #miniN{display:none}
body.inside #mini,body.inside #miniN{display:none}
.slot .cnt{position:absolute;left:4px;top:2px;font:700 10px var(--f-ui);background:var(--ink);color:#fff;border-radius:7px;padding:0 4px;line-height:14px}
#fade{position:fixed;inset:0;z-index:20;background:#141A2E;opacity:0;pointer-events:none;transition:opacity .8s}
#fade.on{opacity:1}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.two{display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>


<canvas id="c" aria-label="燈芯島 3D 場景"></canvas>

<div class="hud" id="tl">
  <div class="card"><div class="t1" id="clock">春季 · 第 1 天 · 07:00</div><div class="t2" id="region">燈芯島 · 小谷村</div></div>
</div>
<div class="hud" id="tr">
  <div class="card money"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="#F7C948" stroke="#C99A1E" stroke-width="2"></circle><rect x="9.5" y="6" width="3" height="10" rx="1.5" fill="#C99A1E"></rect></svg><span id="coinTxt">0</span></div>
  <div class="card sta">體力<div id="staBar"><div id="staFill"></div></div></div>
</div>
<div id="side">
  <button class="sbtn" type="button" data-p="bag"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3B2A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>背包</button>
  <button class="sbtn" type="button" data-p="craft"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3B2A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"></path><path d="M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"></path></svg>配方書</button>
  <button class="sbtn" type="button" data-p="dress"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3B2A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4L3 7l2 4 3-1v10h8V10l3 1 2-4-5-3a4 4 0 0 1-8 0z"></path></svg>換裝</button>
  <button class="sbtn" type="button" data-p="inn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3B2A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6"></path><path d="M6 10v9h12v-9"></path><path d="M10 19v-5h4v5"></path></svg>旅人小屋<span class="badge">限定</span></button>
  <button class="sbtn" type="button" data-p="save"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3B2A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M8 4v5h7V4"></path><path d="M8 20v-6h8v6"></path></svg>存檔</button>
  <button class="sbtn" type="button" data-p="quest"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3B2A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h11v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2h12"></path><path d="M7 4a2 2 0 0 0-2 2v10"></path></svg>任務</button>
</div>
<div id="hotbar" role="toolbar" aria-label="快捷列"></div>
<div class="hud card" id="toast" role="status" aria-live="polite"></div>
<div id="lay" hidden>
  <div class="row"><b style="font-size:17px;margin-right:auto">布置模式</b><span id="layBtns" class="row"></span>
    <button class="pbtn go" type="button" id="layDone">完成</button></div>
  <div class="note" id="layHint"></div>
  <div id="layItems"></div>
</div>

  <div id="mapBox">
    <canvas id="big" aria-label="燈芯島地圖，可拖曳與縮放"></canvas>
    <div class="card" id="mapTitle">燈芯島地圖</div>
    <button class="mbtn" id="mClose" type="button" aria-label="關閉地圖" style="right:12px;top:12px">×</button>
    <button class="mbtn" id="mIn" type="button" aria-label="放大" style="right:12px;top:76px">+</button>

  </div>
</div>

<button id="act2" type="button" hidden>搖樹</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
const SKY=0xCDEBF5;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,95,200);
const camera=new THREE.PerspectiveCamera(42,1,0.1,400);

const hemi=new THREE.HemisphereLight(0xffffff,0x9fbf88,0.65);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(12,24,10);scene.add(sun);

// curved-world bend shared by every material
const CURVE=0.006;const curveU={value:CURVE};const colliders=[];const treeDots=[];
function bend(m){
  m.onBeforeCompile=function(sh){
    sh.uniforms.uCurve=curveU;
    sh.vertexShader='uniform float uCurve;\n'+sh.vertexShader.replace('#include <project_vertex>',
      'vec4 mvPosition = modelViewMatrix * vec4( transformed, 1.0 );\n'+
      'float dz = max(0.0, -mvPosition.z - 14.0);\n'+
      'mvPosition.y -= uCurve * dz * dz;\n'+
      'gl_Position = projectionMatrix * mvPosition;');
  };
  return m;
}
const grad=new THREE.DataTexture(new Uint8Array([105,105,105,255,185,185,185,255,255,255,255,255]),3,1,THREE.RGBAFormat);
grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.generateMipmaps=false;grad.needsUpdate=true;
const matCache={};
function toon(c,own){
  if(!own&&matCache[c])return matCache[c];
  const m=bend(new THREE.MeshToonMaterial({color:c,gradientMap:grad}));
  if(!own)matCache[c]=m;return m;
}
const outlineMat=bend(new THREE.MeshBasicMaterial({color:0x3B2A1E,side:THREE.BackSide}));
function part(geo,mat,x,y,z,parent,ol){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
  if(ol!==0){const o=new THREE.Mesh(geo,outlineMat);o.scale.setScalar(1+(ol||0.07));m.add(o);}
  (parent||scene).add(m);return m;
}

// seeded rng
let seed=20261016;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}

// water + island
const water=new THREE.Mesh(new THREE.PlaneGeometry(700,700,1,1),bend(new THREE.MeshToonMaterial({color:0x6EC3DE,gradientMap:grad})));
water.rotation.x=-Math.PI/2;water.position.y=-1.1;scene.add(water);
const R=62;
part(new THREE.CylinderGeometry(R+5,R+7,2.4,56),toon(0xF1DCA4),0,-1.3,0,null,0.015);
part(new THREE.CylinderGeometry(R,R+1.5,2,56),toon(0x8FCB6B),0,-0.99,0,null,0.012);

// region tests
const inForest=(x,z)=>z<-21;
const inCoast=(x,z)=>x>28&&z>-21;

// animatable forest materials
const lerps=[];
function fadeMat(fromHex,toHex){const m=toon(fromHex,true);lerps.push({m,a:new THREE.Color(fromHex),b:new THREE.Color(toHex)});return m;}
const fLeaf=fadeMat(0x8C918F,0x3F8A3F),fLeaf2=fadeMat(0x9AA09C,0x5DAE55),fTrunk=fadeMat(0x6E6A68,0x8A5A36),fFloor=fadeMat(0x7D8380,0x6FB352),fStatue=fadeMat(0x9A9690,0xE0663F);

// forest floor patches
for(let i=0;i<14;i++){
  const a=-Math.PI*0.5+(rnd()-0.5)*2.2, r=30+rnd()*24;
  const x=Math.cos(a)*r, z=Math.sin(a)*r; if(!inForest(x,z))continue;
  const d=new THREE.Mesh(new THREE.CircleGeometry(9+rnd()*6,18),fFloor);d.rotation.x=-Math.PI/2;d.position.set(x,0.03+i*0.002,z);scene.add(d);
}

// trees

  };return m;
}

    const PR=0.55;let hit=false;
    for(let it=0;it<2;it++){
      for(const c of (inside?furnCol:colliders)){const dx=nx-c.x,dz=nz-c.z,d=Math.hypot(dx,dz),md=c.r+PR;if(d<md&&d>1e-4){nx=c.x+dx/d*md;nz=c.z+dz/d*md;hit=true;}}
      if(inside)continue;
      // workshop house: rotated box
      const hr=house.rotation.y,cs=Math.cos(hr),sn=Math.sin(hr);
      const rx=nx-house.position.x,rz=nz-house.position.z;
      let lx=rx*cs-rz*sn,lz=rx*sn+rz*cs;const hx=2.5+PR,hz=2.1+PR;
      if(Math.abs(lx)<hx&&Math.abs(lz)<hz){hit=true;const px=hx-Math.abs(lx),pz=hz-Math.abs(lz);if(px<pz)lx=Math.sign(lx||1)*hx;else lz=Math.sign(lz||1)*hz;
        nx=house.position.x+lx*cs+lz*sn;nz=house.position.z-lx*sn+lz*cs;}
    }
    if(hit&&!wasHit){bumpT=0.18;}
    wasHit=hit;
    p.x=nx;p.z=nz;
    player.rotation.y=Math.atan2(mx,mz);walk+=dt*12;
    body.position.y=Math.abs(Math.sin(walk))*0.14;
  }else{body.position.y*=0.8;wasHit=false;}
  if(bumpT>0){bumpT-=dt;const k=Math.max(0,bumpT)/0.18;body.scale.set(1+0.18*k,1-0.16*k,1+0.18*k);}else body.scale.set(1,1,1);

  // camera
  if(layout)camPos.lerp(new THREE.Vector3(RX,19,RZ+11),1-Math.pow(0.0005,dt));
  else if(inside)camPos.lerp(new THREE.Vector3(p.x,p.y+12,p.z+11),1-Math.pow(0.002,dt));
  else camPos.lerp(new THREE.Vector3(p.x,p.y+21,p.z+18),1-Math.pow(0.002,dt));
  camera.position.copy(camPos);if(layout)camLook.set(RX,0,RZ+1);else camLook.set(p.x,p.y+1,p.z-(inside?2:3));camera.lookAt(camLook);

  // moth
  moth.position.set(p.x+Math.cos(t*1.3)*1.4,2.6+Math.sin(t*2.1)*0.3,p.z+Math.sin(t*1.3)*1.4);
  const fl=Math.sin(t*22)*0.9;wL.rotation.y=fl;wR.rotation.y=-fl;

  // ambient
  lanterns.forEach((l,i)=>{l.scale.setScalar(1+Math.sin(t*2+i)*0.15);});
  if(brewObj)brewObj.material.color.setHSL(0.72,0.55,0.72+Math.sin(t*3)*0.05);
  if(fireObj)fireObj.scale.set(1+Math.sin(t*17)*0.12,1+Math.sin(t*23)*0.2,1+Math.sin(t*19)*0.12);
  smokes.forEach((m,i)=>{const k=((t*0.35+i/smokes.length)%1);m.position.set(1.4+Math.sin(t+i)*0.3,6.5+k*3.5,-0.6);m.scale.setScalar(0.6+k*1.4);});smokeM.opacity=0.55;
  const drift=m=>{const u=m.userData;m.position.x=u.bx+Math.sin(t*0.4+u.ph)*1.5;m.position.z=u.bz+Math.cos(t*0.3+u.ph)*1.2;};
  coastMist.arr.forEach(drift);
  if(forestMist.mat.opacity>0.001)forestMist.arr.forEach(drift);

  // purify animation
  if(purifyT>=0){
    purifyT+=dt;const k=Math.min(1,purifyT/2.6),e=k*k*(3-2*k);
    ring.material.opacity=(1-k)*0.85;ring.scale.setScalar(1+e*40);
    forestMist.mat.opacity=0.8*(1-e);forestMist.arr.forEach(m=>{const s=m.userData.s*(1+e*0.8);m.scale.set(s*1.5,s,1);m.position.y+=dt*1.5;});
    lerps.forEach(l=>l.m.color.copy(l.a).lerp(l.b,e));
    if(k>=1){purifyT=-1;purified=true;forestMist.arr.forEach(m=>{m.visible=false;});toast('火苔之森淨化完成！灰霧變成了白霧，沉睡的火苔精醒來了。',4200);}
  }
  if(purified){spirit.position.y=Math.abs(Math.sin(t*3))*0.35;spirit.rotation.y=Math.sin(t)*0.4;}

  nodes.forEach(n=>{const on=nodeActive(n);if(n.g.visible!==on)n.g.visible=on;if(on&&n.g.userData.spin){n.g.userData.spin.rotation.y=t*2;n.g.userData.spin.position.y=0.5+Math.sin(t*3+n.x)*0.08;}});
  {const h=hourNow();let L;if(h>=7&&h<17)L=1;else if(h>=17&&h<20)L=1-(h-17)/3*0.84;else if(h>=5&&h<7)L=0.16+(h-5)/2*0.84;else L=0.16;
   if(inside){hemi.intensity=0.65;sun.intensity=0.75;}else{hemi.intensity=0.25+0.4*L;sun.intensity=0.15+0.6*L;
   const sky=new THREE.Color(SKY).lerp(new THREE.Color(0x1C2546),1-L);if(h>=17&&h<20)sky.lerp(new THREE.Color(0xF2A96B),0.35*Math.sin((h-17)/3*Math.PI));scene.background.copy(sky);if(scene.fog)scene.fog.color.copy(sky);}}
  // trees: occlusion fade + chop animation
  trees.forEach(t=>{
    const dz=t.z-p.z,dx=Math.abs(t.x-p.x);
    const occl=t.state==='up'&&dz>-0.5&&dz<7&&dx<2.3*t.s;
    const target=occl?0.28:1;t.alpha+=(target-t.alpha)*Math.min(1,dt*8);
    const fading=t.alpha<0.97;
    t.mats.forEach(m=>{if(m.transparent!==fading){m.transparent=fading;m.depthWrite=!fading;m.needsUpdate=true;}m.opacity=fading?t.alpha:1;});
    t.outlines.forEach(o=>{o.visible=!fading;});
    if(t.state==='up'){if(t.t>0){t.t-=dt;t.g.rotation.z=Math.sin(t.t*60)*0.06*(t.t/0.32);}else t.g.rotation.z=0;}
    else if(t.state==='falling'){t.t+=dt;const k=Math.min(1,t.t/0.7);t.g.rotation.z=k*k*1.45;if(k>=1){t.state='stump';t.t=0;t.g.rotation.z=0;t.crown.forEach(c=>c.visible=false);t.trunk.scale.y=0.35;t.trunk.position.y=0.28;t.cut.visible=true;t.col.r=0.42*t.s;}}
    else if(t.state==='stump'){if(false){t.state='up';t.hits=0;t.t=0;t.g.rotation.z=0;t.crown.forEach(c=>{c.visible=true;});t.trunk.scale.y=1;t.trunk.position.y=0.8;t.col.r=0.75*t.s;}}
  });
  rocks.forEach(r=>{
    if(r.t>0){r.t-=dt;const k=r.t/0.25;r.m.position.x=r.x+Math.sin(r.t*90)*0.08*k;}else r.m.position.x=r.x;
    if(r.state==='empty'){r.m.scale.set(r.sc[0]*0.6,r.sc[1]*0.5,r.sc[2]*0.6);r.mat.color.setHex(0x8C877F);if(false){r.state='full';r.hits=0;r.regrow=0;r.m.scale.set(r.sc[0],r.sc[1],r.sc[2]);r.mat.color.setHex(0xA9A39A);}}
  });

  // region label
  let reg='燈芯島 · 小谷村';
  if(inside)reg='工坊 · 室內';
  else if(p.z<-17)reg=purified?'火苔之森':'火苔之森（灰霧）';
  else if(p.x>22)reg='潮汐海岸（灰霧）';
  else if(Math.hypot(p.x,p.z+13)<9)reg='燈芯樹';
  if(reg!==lastRegion){$('region').textContent=reg;lastRegion=reg;}

  // context action
  if(inside){let near=null,nd=1e9;items.forEach(it=>{if(!['f_bed','f_chest','f_chair'].includes(it.id))return;it.cols.forEach(c=>{const d=Math.hypot(c.x-p.x,c.z-p.z);if(d<nd){nd=d;near={it,c};}});});
    if(sitting!==null)ctx={a:'stand',label:'起身'};
    else if(Math.hypot(p.x-DOORMAT.x,p.z-DOORMAT.z)<1.3)ctx={a:'exit',label:'出門'};
    else if(near&&nd<1.95&&near.it.id==='f_chair')ctx={a:'sit',label:'坐下',x:near.it.g.position.x,z:near.it.g.position.z,rot:near.it.rot};
    else if(near&&nd<1.95)ctx=near.it.id==='f_bed'?{a:'sleep',label:'睡覺',x:near.c.x,z:near.c.z}:{a:'chest',label:'收納箱',x:near.c.x,z:near.c.z};
    else if(STATIONS.some(o=>o.inside&&Math.hypot(o.x-p.x,o.z-p.z)-o.r<1.6)){const o=STATIONS.find(o=>o.inside&&Math.hypot(o.x-p.x,o.z-p.z)-o.r<1.6);ctx={a:'station',s:o.id,label:o.name};}
    else ctx={a:'layout',label:'布置'};}
  else{
  let best=null,bd=2.4;mushes.forEach(m=>{if(!m.alive)return;const d=Math.hypot(m.x-p.x,m.z-p.z);if(d<bd){bd=d;best=m;}});
  let bt=null,btd=1e9;trees.forEach(t=>{if(t.state!=='up'||(t.forest&&!purified))return;const d=Math.hypot(t.x-p.x,t.z-p.z)-t.col.r;if(d<1.3&&d<btd){btd=d;bt=t;}});
  let br=null,brd=1e9;rocks.forEach(r=>{if(r.state!=='full')return;const d=Math.hypot(r.x-p.x,r.z-p.z)-r.r;if(d<1.3&&d<brd){brd=d;br=r;}});
  let bn=null,bnd=1.8;nodes.forEach(n=>{if(!nodeActive(n))return;const d=Math.hypot(n.x-p.x,n.z-p.z);if(d<bnd){bnd=d;bn=n;}});
  if(bn)ctx={a:'node',n:bn,label:'採集'};
  else if(best)ctx={a:'pick',m:best,label:'採集'};
  else if(br&&(!bt||brd<btd))ctx=!T('pick')?{a:'need',label:'敲石頭',msg:'需要鎬才能敲石頭。先搖樹收集樹枝，到工具台做簡易鎬。'}:stamina<3?{a:'need',label:'敲石頭',msg:'太累了。吃個紅帽蘑菇補體力吧。'}:{a:'mine',r:br,label:'敲石頭'};
  else if(bt)ctx=!T('axe')?{a:'shake',t:bt,label:'搖樹'}:stamina<3?{a:'need',label:'砍樹',msg:'太累了。吃個紅帽蘑菇補體力吧。'}:{a:'chop',t:bt,label:'砍樹'};
  else if(!purified&&purifyT<0&&p.z<-17)ctx=inv.potion>0?{a:'purify',label:'淨霧'}:{a:'need',label:'淨霧',msg:'還沒有淨霧藥劑。配方：紅帽蘑菇 ×3 ＋ 藍水晶 ×1，到工坊裡的釜製作。'};
  else if(purified&&Math.hypot(p.x-spirit.position.x,p.z-spirit.position.z)<4)ctx={a:'spirit',label:'對話'};
  else if(Math.hypot(p.x-DOOR_IN.x,p.z-DOOR_IN.z)<1.5)ctx={a:'enter',label:'進屋'};
  else{const st=STATIONS.find(o=>Math.hypot(o.x-p.x,o.z-p.z)-o.r<1.6);
    if(st)ctx={a:'station',s:st.id,label:st.name};
    else if(Math.hypot(p.x,p.z+13)<6)ctx={a:'tree',label:'觀察'};
    else ctx={a:'none',label:'互動'};}
  }
  if(actBtn.dataset.a!==ctx.a||actBtn.textContent!==ctx.label){actBtn.dataset.a=ctx.a;actBtn.textContent=ctx.label;}
  {const a2=$('act2');const show=!inside&&!layout&&typeof ctx.t==='object'&&ctx.t&&ctx.t.wood!==undefined&&T('axe')&&(ctx.a==='chop'||ctx.a==='need')&&ctx.label==='砍樹';if(a2.hidden===!!show){a2.hidden=!show;}a2._t=show?ctx.t:null;}
  if(usedT>0){usedT-=dt;if(usedT<=0){usedSlot='';hotbarUI();}}

  if(!inside){const [c,w,h]=fitCanvas(mini);drawMap(c,w,h,player.position.x,player.position.z,1.15,false);}
  if(mapOpen){const [c,w,h]=fitCanvas(big);drawMap(c,w,h,mcx,mcz,baseScale()*mapZ,true);}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
// ---- M1 save system: localStorage, versioned, auto-save. Trees/rocks/mushrooms are not saved (they reset each day).
const SAVE_KEY='mist-isle-save',SAVE_V=1;
function saveGame(){if(skipSave)return;try{const pos=inside?[7.3,7.1]:[player.position.x,player.position.z];
  const d={v:SAVE_V,inv,tools,store,storeTools,BAG_MAX,day,gameMin,stamina,purified,timeRing,accOwned,accWorn,seen:[...seen],coins,dq,
    furn:items.filter(it=>!it.fixed).map(it=>({id:it.id,ix:it.ix,iz:it.iz,rot:it.rot})),pos};
  localStorage.setItem(SAVE_KEY,JSON.stringify(d));}catch(e){}}
function loadGame(){let d=null;try{d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){return false;}
  if(!d||d.v!==SAVE_V)return false;
  inv=Object.assign({mush:0,wood:0,stone:2,crys:0,potion:0,stam:0,branch:0,clay:0,iron:0,flax:0,cloth:0,moon:0,dew:0},d.inv||{});
  tools=d.tools||{axe:[],pick:[]};store=d.store||{};storeTools=d.storeTools||{axe:[],pick:[]};
  BAG_MAX=d.BAG_MAX||20;day=d.day||1;gameMin=(typeof d.gameMin==='number')?d.gameMin:gameMin;
  stamina=(typeof d.stamina==='number')?d.stamina:stamina;coins=d.coins||0;dq=(d.dq&&d.dq.day===day)?d.dq:{day,prog:{},claimed:{}};timeRing=!!d.timeRing;accOwned=Object.assign({},d.accOwned||{});if(timeRing)accOwned.ring=true;accWorn=(Array.isArray(d.accWorn)?d.accWorn:(d.acc?[d.acc]:[])).filter(k=>accOwned[k]).slice(0,ACC_SLOTS);seen=new Set((d.seen||[]).filter(k=>TRIAL_MATS.indexOf(k)>=0));
  items.filter(it=>!it.fixed).forEach(removeItem);
  (d.furn||[]).forEach(f=>{if(FURN[f.id]&&cellsOf(f.id,f.ix,f.iz,f.rot).every(([a,b])=>!occ[a+','+b]))addItem(f.id,f.ix,f.iz,f.rot);});
  if(d.purified){purified=true;forestMist.mat.opacity=0;forestMist.arr.forEach(m=>{m.visible=false;});}
  if(d.pos){player.position.x=d.pos[0];player.position.z=d.pos[1];}
  tierShownLv=tierNow();hotbarUI();staUI();return true;}
const loaded=loadGame();
setInterval(saveGame,10000);
addEventListener('pagehide',saveGame);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
window.__save={save:saveGame,load:loadGame,key:SAVE_KEY,loaded};
requestAnimationFrame(frame);
setTimeout(()=>toast('拖曳左下搖桿移動。先搖樹收集樹枝，到工坊的工具台做簡易斧和簡易鎬；砍樹、敲石頭收集材料，再到釜鍊淨霧藥劑，淨化北邊的灰霧。',6500),900);
})();
